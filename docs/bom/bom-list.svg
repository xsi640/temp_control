<text x="212" y="1181" font-size="14.2" fill="#16222f" text-anchor="start" font-weight="600" opacity="1">SSR 散热片 / 外壳 / 通风扇</text>
<text x="656" y="1181" font-size="14" fill="#16222f" text-anchor="middle" font-weight="700" opacity="1">可选</text>
<text x="704" y="1181" font-size="12.4" fill="#5b6b7c" text-anchor="start" font-weight="400" opacity="1">按柜体结构与散热需求配置</text>
<rect x="64" y="392" width="1272" height="812" rx="8" fill="none" stroke="#dbe3ec" stroke-width="1.2"/>
<text x="64" y="1246" font-size="14.5" fill="#16222f" text-anchor="start" font-weight="700" opacity="1">选型提示</text>
<text x="64" y="1272" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="400" opacity="1">· SSR 输入电流按实物规格核算，常见 10–15mA/路；5V 电源建议 ≥1A 并留余量。</text>
<text x="64" y="1295" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="400" opacity="1">· NTC 与 10kΩ 上拉电阻直接决定测温精度，建议 1% 电阻、同批次 B3950 探头。</text>
<text x="64" y="1318" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="400" opacity="1">· 阻性加热负载可选过零型 SSR；感性负载需选随机型并按需加 RC 吸收。</text>
<text x="64" y="1341" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="400" opacity="1">· 清单为功能最小集；外壳、散热片、端子数量按柜体结构增减。</text>
<rect x="760" y="1228" width="576" height="132" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.2"/>
<text x="780" y="1256" font-size="14" fill="#b3261e" text-anchor="start" font-weight="700" opacity="1">安全提示</text>
<text x="780" y="1283" font-size="11.8" fill="#7f1d1d" text-anchor="start" font-weight="400" opacity="1">· 220V 强电必须断电接线，加保险丝并可靠绝缘。</text>
<text x="780" y="1307" font-size="11.8" fill="#7f1d1d" text-anchor="start" font-weight="400" opacity="1">· 强弱电分区走线，禁止并行缠绕；金属外壳接地。</text>
<text x="780" y="1331" font-size="11.8" fill="#7f1d1d" text-anchor="start" font-weight="400" opacity="1">· 烧录和调试时先断开 220V，只保留 5V 弱电。</text>
<path d="M64 1390 L1336 1390" fill="none" stroke="#dbe3ec" stroke-width="1.2" stroke-linecap="round"/>
<text x="64" y="1422" font-size="12" fill="#8b98a6" text-anchor="start" font-weight="600" opacity="1">temp_control · 五路温控系统</text>
<text x="1336" y="1422" font-size="12" fill="#8b98a6" text-anchor="end" font-weight="400" opacity="1">BOM v1.0 · 2026-11</text>
